  <g fill="#ffffff"
     stroke="#0f766e" stroke-width="2">
    <circle cx="70" cy="98" r="4"/>
    <circle cx="114" cy="77" r="4"/>
    <circle cx="158" cy="88" r="4"/>
    <circle cx="202" cy="55" r="4"/>
    <circle cx="246" cy="41" r="4"/>
    <circle cx="280" cy="49" r="4"/>
